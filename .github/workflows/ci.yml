name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Unit tests only for now; macOS and Windows runs come with the end-to-end tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build

  e2e:
    # The built desktop app, driven through Playwright, on each OS: under a virtual display on
    # Linux, on the runner's own display on macOS and Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Electron's Chromium needs the same system libraries as Playwright's.
      - if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - if: runner.os == 'Linux'
        continue-on-error: true
        run: xvfb-run --auto-servernum npm run e2e
      - if: runner.os == 'Linux'
        continue-on-error: true
        run: E2E_DISABLE_GPU=1 xvfb-run --auto-servernum npm test -w @cerebro-ide/e2e
      - if: runner.os == 'Linux'
        continue-on-error: true
        run: xvfb-run --auto-servernum npm test -w @cerebro-ide/e2e -- host
      - if: runner.os == 'Linux'
        continue-on-error: true
        run: xvfb-run --auto-servernum npm test -w @cerebro-ide/e2e -- host
      - if: runner.os != 'Linux'
        run: npm run e2e
