name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Unit tests only for now; macOS and Windows runs come with the end-to-end tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build

  e2e:
    # The built desktop app, driven through Playwright, under a virtual display. Linux for now;
    # macOS and Windows runs come next.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Electron's Chromium needs the same system libraries as Playwright's.
      - run: npx playwright install-deps chromium
      - run: xvfb-run --auto-servernum npm run e2e
