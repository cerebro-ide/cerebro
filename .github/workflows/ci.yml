name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Unit tests only for now; macOS and Windows runs come with the end-to-end tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The browser tests run in the runner's own Chrome: installing Playwright's Chromium and its
      # libraries took 21 s to 10 minutes, waiting on apt.
      - run: npm run check
        env:
          CEREBRO_BROWSER_CHANNEL: chrome
      - run: npm run build

  e2e:
    # The built desktop app, driven through Playwright, on each OS: under a virtual display on
    # Linux, on the runner's own display on macOS and Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # No system libraries to install: GitHub's Ubuntu runner comes with Chrome (so Chromium's
      # libraries) and xvfb. Installing Playwright's took 11 s to 10 minutes, waiting on apt.
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run e2e
      - if: runner.os != 'Linux'
        run: npm run e2e
