name: CI

# On pull requests only: a pull request's run already tests its merge into main, so main isn't run
# again after the merge. The repository is private, with the free plan's 2,000 minutes a month
# (blocked when they run out), each job rounded up to a whole minute, and macOS minutes priced at
# about 10 times Linux's, Windows' at about 1.7 times (GitHub's docs).
on:
  pull_request:
    paths-ignore: ['**.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Formatting, lint, types, unit and browser tests, the build, and the end-to-end tests on Linux,
    # in one job: one install and one rounded-up minute fewer than separate jobs.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Nothing to install: GitHub's Ubuntu runner comes with Google Chrome, for the browser tests,
      # and with Chromium's libraries and xvfb, for Electron. Installing Playwright's Chromium and
      # its libraries took 11 s to 10 minutes, waiting on apt.
      - run: npm run check
        env:
          CEREBRO_BROWSER_CHANNEL: chrome
      - run: npm run build
      - run: xvfb-run --auto-servernum npm run e2e

  e2e:
    # The built desktop app on macOS and Windows, on the runner's own display. Only once the
    # check passes, so their dearer minutes aren't spent on a change that fails anyway.
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run e2e
